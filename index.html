<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0d1a">
<title>SPADE ARC — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-box">
    <div class="auth-logo">SPADE <span>ARC</span></div>
    <div class="auth-tagline">Build the physique. Own the arc.</div>

    <div class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab active" onclick="switchAuthTab('login')">Sign In</button>
        <button class="auth-tab" onclick="switchAuthTab('signup')">Create Account</button>
      </div>

      <div id="auth-error" class="auth-error"></div>

      <!-- LOGIN -->
      <form id="form-login" class="auth-form active" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-input" id="login-email" placeholder="you@email.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="form-input" id="login-password" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn" id="login-btn">Sign In</button>
        <div style="text-align:center;margin-top:14px">
          <a href="#" onclick="switchAuthTab('forgot')" style="font-size:12px;color:var(--muted)">Forgot password?</a>
        </div>
      </form>

      <!-- SIGNUP -->
      <form id="form-signup" class="auth-form" onsubmit="handleSignup(event)">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-input" id="signup-email" placeholder="you@email.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="form-input" id="signup-password" placeholder="At least 6 characters" required autocomplete="new-password" minlength="6">
        </div>
        <button type="submit" class="btn" id="signup-btn">Create Account</button>
        <p style="font-size:11px;color:var(--muted);text-align:center;margin-top:14px;line-height:1.6">
          Free 7-day trial. $20/month after. Cancel anytime.
        </p>
      </form>

      <!-- FORGOT PASSWORD -->
      <form id="form-forgot" class="auth-form" onsubmit="handleForgot(event)">
        <p style="font-size:13px;color:var(--muted);margin-bottom:18px;line-height:1.6">Enter your email and we'll send a reset link.</p>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-input" id="forgot-email" placeholder="you@email.com" required>
        </div>
        <button type="submit" class="btn" id="forgot-btn">Send Reset Link</button>
        <div style="text-align:center;margin-top:14px">
          <a href="#" onclick="switchAuthTab('login')" style="font-size:12px;color:var(--muted)">Back to sign in</a>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="/js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const { createClient } = supabase;
const sb = createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);

// Check if already logged in
sb.auth.getSession().then(({ data }) => {
  if (data.session) window.location.href = 'app.html';
});

function switchAuthTab(tab) {
  document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
  const tabs = { login: 0, signup: 1, forgot: 2 };
  document.querySelectorAll('.auth-tab')[tabs[tab] ?? 0]?.classList.add('active');
  document.getElementById('form-' + tab).classList.add('active');
  hideError();
}

function showError(msg) {
  const el = document.getElementById('auth-error');
  el.textContent = msg;
  el.style.display = 'block';
}
function hideError() {
  document.getElementById('auth-error').style.display = 'none';
}

async function handleLogin(e) {
  e.preventDefault();
  hideError();
  const btn = document.getElementById('login-btn');
  btn.textContent = 'Signing in...';
  btn.disabled = true;
  const { error } = await sb.auth.signInWithPassword({
    email: document.getElementById('login-email').value,
    password: document.getElementById('login-password').value,
  });
  if (error) { showError(error.message); btn.textContent = 'Sign In'; btn.disabled = false; return; }
  window.location.href = 'app.html';
}

async function handleSignup(e) {
  e.preventDefault();
  hideError();
  const btn = document.getElementById('signup-btn');
  btn.textContent = 'Creating account...';
  btn.disabled = true;
  const email = document.getElementById('signup-email').value;
  const password = document.getElementById('signup-password').value;
  const { data, error } = await sb.auth.signUp({ email, password });
  if (error) { showError(error.message); btn.textContent = 'Create Account'; btn.disabled = false; return; }
  if (data.user) {
    // Create profile
    await sb.from('profiles').upsert({
      id: data.user.id,
      current_phase: 1,
      current_week: 1,
      start_date: new Date().toISOString().split('T')[0],
      subscription_status: 'trial',
      trial_start: new Date().toISOString(),
    });
    window.location.href = 'app.html';
  }
}

async function handleForgot(e) {
  e.preventDefault();
  hideError();
  const btn = document.getElementById('forgot-btn');
  btn.textContent = 'Sending...';
  btn.disabled = true;
  const { error } = await sb.auth.resetPasswordForEmail(
    document.getElementById('forgot-email').value,
    { redirectTo: window.location.origin + '/app.html' }
  );
  if (error) { showError(error.message); btn.textContent = 'Send Reset Link'; btn.disabled = false; return; }
  btn.textContent = 'Sent! Check your email';
}
</script>
</body>
</html>
